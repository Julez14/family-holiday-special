name: Verify holiday cartoon
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: python3 -m venv renderer/.venv && renderer/.venv/bin/pip install -r renderer/requirements.txt
      - run: npm run test:media
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:scenarios
      - run: npm run deploy:check
      - run: docker build -t holiday-renderer:ci ./renderer
